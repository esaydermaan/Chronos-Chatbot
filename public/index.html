<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Chronos Intelligence — Asistente</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: #F5F0E8;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  #setup-screen {
    background: #fff;
    border-radius: 16px;
    padding: 40px 36px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 4px 32px rgba(15,28,46,0.10);
    text-align: center;
  }
  .setup-logo {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: #C9A84C;
    color: #0F1C2E;
    font-family: 'DM Serif Display', serif;
    font-size: 24px;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 16px;
  }
  .setup-title { font-family: 'DM Serif Display', serif; font-size: 22px; color: #0F1C2E; margin-bottom: 6px; }
  .setup-sub { font-size: 13px; color: #888; margin-bottom: 24px; line-height: 1.6; }
  .setup-input {
    width: 100%; padding: 11px 14px;
    border: 1px solid #ddd; border-radius: 8px;
    font-family: 'DM Sans', sans-serif; font-size: 13.5px;
    color: #0F1C2E; outline: none; margin-bottom: 12px;
    transition: border-color 0.15s;
  }
  .setup-input:focus { border-color: #C9A84C; }
  .setup-btn {
    width: 100%; padding: 11px;
    background: #0F1C2E; color: #C9A84C;
    border: none; border-radius: 8px;
    font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500;
    cursor: pointer; transition: opacity 0.15s;
  }
  .setup-btn:hover { opacity: 0.88; }
  .setup-note { font-size: 11px; color: #aaa; margin-top: 14px; line-height: 1.6; }

  #chat-screen { display: none; width: 100%; max-width: 480px; }
  .ci-wrap {
    background: #fff; border-radius: 16px; overflow: hidden;
    display: flex; flex-direction: column; height: 620px;
    box-shadow: 0 4px 32px rgba(15,28,46,0.12);
  }
  .ci-header {
    background: #0F1C2E; padding: 14px 20px;
    display: flex; align-items: center; gap: 12px; flex-shrink: 0;
  }
  .ci-logo {
    width: 36px; height: 36px; border-radius: 50%; background: #C9A84C;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 500; color: #0F1C2E;
    font-family: 'DM Serif Display', serif;
  }
  .ci-header-name { font-family: 'DM Serif Display', serif; font-size: 15px; color: #F5F0E8; }
  .ci-header-status { font-size: 11px; color: #C9A84C; display: flex; align-items: center; gap: 5px; margin-top: 2px; }
  .ci-dot { width: 6px; height: 6px; border-radius: 50%; background: #C9A84C; }

  .ci-messages {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
    scroll-behavior: smooth; background: #FAFAF8;
  }
  .ci-messages::-webkit-scrollbar { width: 4px; }
  .ci-messages::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }

  .msg { display: flex; gap: 8px; max-width: 88%; animation: fadeUp 0.2s ease; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:translateY(0); } }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.bot  { align-self: flex-start; }

  .msg-avatar {
    width: 28px; height: 28px; border-radius: 50%; background: #C9A84C;
    color: #0F1C2E; font-size: 11px; font-weight: 500;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-family: 'DM Serif Display', serif;
  }
  .msg.user .msg-avatar { background: #E8E4DC; color: #888; font-family: 'DM Sans', sans-serif; }

  .msg-bubble {
    padding: 10px 14px; border-radius: 14px;
    font-size: 13.5px; line-height: 1.65;
    background: #fff; border: 1px solid #EDEAE3; color: #1a1a1a;
  }
  .msg.bot .msg-bubble {
    background: #0F1C2E; color: #F5F0E8;
    border-color: #1E3048; border-radius: 4px 14px 14px 14px;
  }
  .msg.user .msg-bubble { border-radius: 14px 4px 14px 14px; }
  .msg-bubble strong { color: #C9A84C; font-weight: 500; }

  .ci-chips { padding: 0 16px 10px; display: flex; gap: 6px; flex-wrap: wrap; background: #FAFAF8; }
  .chip {
    font-size: 12px; padding: 5px 12px; border-radius: 20px;
    border: 1px solid #C9A84C; background: transparent; color: #C9A84C;
    cursor: pointer; transition: all 0.15s; font-family: 'DM Sans', sans-serif;
  }
  .chip:hover { background: #C9A84C; color: #0F1C2E; }

  .ci-input-row {
    padding: 12px 16px; border-top: 1px solid #EDEAE3;
    display: flex; gap: 8px; align-items: center; flex-shrink: 0; background: #fff;
  }
  .ci-input {
    flex: 1; font-family: 'DM Sans', sans-serif; font-size: 13.5px;
    padding: 9px 14px; border-radius: 20px; border: 1px solid #ddd;
    background: #FAFAF8; color: #1a1a1a; outline: none; transition: border-color 0.15s;
  }
  .ci-input:focus { border-color: #C9A84C; }
  .ci-input::placeholder { color: #bbb; }

  .ci-send {
    width: 36px; height: 36px; border-radius: 50%; background: #C9A84C;
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s, opacity 0.15s; flex-shrink: 0;
  }
  .ci-send:hover { transform: scale(1.06); }
  .ci-send:disabled { opacity: 0.4; cursor: default; transform: none; }

  .typing { display: flex; gap: 4px; align-items: center; padding: 4px 0; }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%; background: #C9A84C;
    animation: bounce 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,60%,100% { transform:translateY(0); } 30% { transform:translateY(-5px); } }
</style>
</head>
<body>

<div id="setup-screen">
  <div class="setup-logo">C</div>
  <div class="setup-title">Chronos Intelligence</div>
  <p class="setup-sub">Introduce tu API key de Anthropic para activar el asistente.</p>
  <input class="setup-input" type="password" id="apiKeyInput" placeholder="sk-ant-api03-..."/>
  <button class="setup-btn" onclick="startChat()">Activar asistente</button>
  <p class="setup-note">Tu key solo se usa en tu sesión y no se almacena en ningún servidor.</p>
</div>

<div id="chat-screen">
  <div class="ci-wrap">
    <div class="ci-header">
      <div class="ci-logo">C</div>
      <div>
        <div class="ci-header-name">Chronos Intelligence</div>
        <div class="ci-header-status"><div class="ci-dot"></div>Asistente activo</div>
      </div>
    </div>
    <div class="ci-messages" id="msgs"></div>
    <div class="ci-chips" id="chips"></div>
    <div class="ci-input-row">
      <input class="ci-input" id="inp" placeholder="Escribe tu pregunta..."/>
      <button class="ci-send" id="sendBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0F1C2E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>
</div>

<script>
const SYSTEM = `Eres el asistente virtual de Chronos Intelligence, una agencia especializada en automatización con IA para joyerías y relojerías. Tu objetivo es guiar al visitante por este flujo:

1. PRIMERO: Hacer el Chronos Leak Test de forma conversacional, una pregunta a la vez:
   a) ¿Cuántas consultas recibes al mes por todos tus canales (WhatsApp, Instagram, web)?
   b) ¿Cuántas acaban comprando? (porcentaje aproximado)
   c) ¿Cuánto tardas en responder a una consulta nueva?
   d) ¿Haces seguimiento a los que preguntaron pero no compraron?
   e) ¿Cuánto suele ser el ticket medio de una venta?

2. DESPUÉS: Dar un diagnóstico con el dinero estimado que pierden. Cálculo: consultas × porcentaje_perdido × ticket_medio. Sé específico con números.

3. FINALMENTE: Recomendar el servicio adecuado:
   - Pérdidas altas → Chronos Scan 72h (130€, descontable)
   - Quieren empezar despacio → Chronos Conversion Kit (400€)
   - Muy interesados → Sistema Chronos 24/7 (1800€)

SERVICIOS:
- Chronos Leak Test: gratuito
- Chronos Scan 72h: 130€ descontable — análisis completo
- Chronos Conversion Kit: 400€ — automatización básica
- Sistema Chronos 24/7: 1800€ — sistema completo
- Chronos Optimize: 200€/mes — mantenimiento

TONO: Profesional pero cercano. Vende resultados, no tecnología. Mensajes cortos, máximo 3-4 líneas. Usa **texto** para destacar cifras.`;

const CHIPS_INIT  = ["Quiero saber cuánto pierdo", "¿Qué hacéis exactamente?", "Ver precios"];
const CHIPS_LATER = ["Quiero el Chronos Scan", "Cuéntame el Conversion Kit", "Sistema completo 24/7"];

let history = [];
let API_KEY = '';

function startChat() {
  const key = document.getElementById('apiKeyInput').value.trim();
  if (!key.startsWith('sk-')) { alert('Introduce una API key válida (empieza por sk-ant-...)'); return; }
  API_KEY = key;
  document.getElementById('setup-screen').style.display = 'none';
  document.getElementById('chat-screen').style.display = 'block';
  initChat();
}

function addMsg(role, html, isTyping = false) {
  const msgs = document.getElementById('msgs');
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
  const av = document.createElement('div');
  av.className = 'msg-avatar';
  av.textContent = role === 'user' ? 'Tú' : 'C';
  const bub = document.createElement('div');
  bub.className = 'msg-bubble';
  bub.innerHTML = isTyping
    ? '<div class="typing"><span></span><span></span><span></span></div>'
    : html;
  wrap.appendChild(av);
  wrap.appendChild(bub);
  msgs.appendChild(wrap);
  msgs.scrollTop = msgs.scrollHeight;
  return bub;
}

function setChips(arr) {
  const c = document.getElementById('chips');
  c.innerHTML = '';
  arr.forEach(t => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.textContent = t;
    b.onclick = () => { document.getElementById('inp').value = t; send(); };
    c.appendChild(b);
  });
}

function mdToHtml(t) {
  return t.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
}

async function callAPI(messages) {
  const res = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-api-key': API_KEY },
    body: JSON.stringify({ model: 'claude-sonnet-4-20250514', max_tokens: 1000, system: SYSTEM, messages })
  });
  const data = await res.json();
  return data.content.map(b => b.text || '').join('');
}

async function send() {
  const inp = document.getElementById('inp');
  const btn = document.getElementById('sendBtn');
  const text = inp.value.trim();
  if (!text) return;
  document.getElementById('chips').innerHTML = '';
  inp.value = '';
  btn.disabled = true;
  addMsg('user', text);
  history.push({ role: 'user', content: text });
  const typingBub = addMsg('bot', '', true);
  try {
    const reply = await callAPI(history);
    typingBub.innerHTML = mdToHtml(reply);
    history.push({ role: 'assistant', content: reply });
    const lower = reply.toLowerCase();
    const showLater = lower.includes('scan') || lower.includes('kit') || lower.includes('24/7') || history.length > 8;
    setChips(showLater ? CHIPS_LATER : []);
  } catch(e) {
    typingBub.innerHTML = 'Error al conectar. Inténtalo de nuevo.';
  }
  btn.disabled = false;
  document.getElementById('msgs').scrollTop = document.getElementById('msgs').scrollHeight;
}

async function initChat() {
  const btn = document.getElementById('sendBtn');
  btn.disabled = true;
  document.getElementById('inp').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
  btn.addEventListener('click', send);
  const typingBub = addMsg('bot', '', true);
  try {
    const reply = await callAPI([{ role: 'user', content: 'Saluda al visitante brevemente, preséntate como el asistente de Chronos Intelligence, y ofrece hacer el diagnóstico gratuito de fugas de ingresos. Máximo 3 líneas.' }]);
    typingBub.innerHTML = mdToHtml(reply);
    history.push({ role: 'assistant', content: reply });
    setChips(CHIPS_INIT);
  } catch(e) {
    typingBub.innerHTML = '¡Hola! Soy el asistente de <strong>Chronos Intelligence</strong>. ¿Quieres descubrir cuánto dinero estás perdiendo cada mes?';
    setChips(CHIPS_INIT);
  }
  btn.disabled = false;
}
</script>
</body>
</html>
